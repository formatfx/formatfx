name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Docs-only PR diffs short-circuit the heavy steps (owner call
      # 2026-07-09: a HANDOFF/README touch-up must not cost a full CI run).
      # The JOB still runs and reports success, so the required check stays
      # satisfied — never convert this to paths-ignore/[skip ci], which would
      # leave the protected checks "expected" forever and block the merge.
      # Push-to-main events skip the detection and always run everything.
      - name: Detect a docs-only diff (PRs only)
        id: docsonly
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)
          echo "changed files:"; echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/|LICENSE|.*\.md$)'; then
            echo "docs-only diff — skipping tests/build for this run" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.docsonly.outputs.skip != 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.docsonly.outputs.skip != 'true'
      - run: npm test
        if: steps.docsonly.outputs.skip != 'true'
      - run: npm run build
        if: steps.docsonly.outputs.skip != 'true'
      # the npm package build + a CLI smoke test, so the lib can't rot
      - run: npm run build:lib
        if: steps.docsonly.outputs.skip != 'true'
      - run: |
          echo '{"elmType":"div","txtContent":"@currentField"}' > /tmp/fixture.json
          node dist-lib/cli.js lint /tmp/fixture.json
        if: steps.docsonly.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.docsonly.outputs.skip != 'true'
        with: { path: dist }
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Fail if Pages deploy did not succeed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # same docs-only fast path as test-build (see the comment there)
      - name: Detect a docs-only diff (PRs only)
        id: docsonly
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)
          echo "changed files:"; echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/|LICENSE|.*\.md$)'; then
            echo "docs-only diff — skipping the browser suite for this run" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.docsonly.outputs.skip != 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.docsonly.outputs.skip != 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.docsonly.outputs.skip != 'true'
      - run: npm run test:ui
        if: steps.docsonly.outputs.skip != 'true'
        env: { PW_CHANNEL: bundled }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report }
