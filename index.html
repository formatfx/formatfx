<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormatFX — visual special effects for SharePoint lists</title>
    <meta
      name="description"
      content="Design SharePoint list and library formatting visually — status pills, data bars, facepile, conditional formatting. If you can use Excel, you can do this."
    />
    <!-- theme-color tracks the app's light/dark surface (--wb-bg) -->
    <meta name="theme-color" content="#faf9f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a19" media="(prefers-color-scheme: dark)" />
    <!-- Open Graph / Twitter: real link previews when the URL is shared in the
         SharePoint / pnp community. TODO: add a raster og:image (1200×630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FormatFX" />
    <meta property="og:title" content="FormatFX — formatting effects for SharePoint lists and libraries" />
    <meta property="og:description" content="Design SharePoint list and library formatting visually — status pills, data bars, facepile, conditional formatting. If you can use Excel, you can do this." />
    <meta property="og:url" content="https://formatfx.dev" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FormatFX — formatting effects for SharePoint lists and libraries" />
    <meta name="twitter:description" content="Design SharePoint list and library formatting visually — status pills, data bars, facepile, conditional formatting. If you can use Excel, you can do this." />
    <!-- Fluent UI icon font (same source SharePoint uses for iconName) -->
    <link
      rel="stylesheet"
      href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.0.0/css/fabric.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
