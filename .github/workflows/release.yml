# Publishes the `formatfx` npm package (library + CLI) when a v* tag is
# pushed. Nothing publishes without BOTH: the NPM_TOKEN repo secret (owner
# adds it once) and a tag push (owner's deliberate act). --provenance ties
# the published tarball to this workflow run.
name: Release (npm)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
permissions:
  contents: read
  id-token: write # npm --provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build:lib
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
